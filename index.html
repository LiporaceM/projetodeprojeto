<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGC — Sistema de Gestão de Clínica (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
/* ===== SGC · identidade "cartão de consulta" =====
   mesa de recepção (fundo), folha da agenda (conteúdo), marca-texto (seleção) */
:root{
  --desk:#E9EEEA; --sheet:#FFFFFF; --ink:#18302C; --ink2:#51665F; --ink3:#83958F;
  --rule:#D3DCD7; --rule2:#E6ECE8;
  --euca:#2E6B5E; --euca-l:#E2EEE9;
  --marker:#F6C945; --marker-l:#FFF2BF; --marker-d:#8A6400;
  --alert:#B8332A; --alert-l:#FAE8E5;
  --cobalt:#2F5597; --cobalt-l:#E6ECF6;
  --display:"Bricolage Grotesque","Inter Display","Inter",system-ui,sans-serif;
  --text:"Atkinson Hyperlegible","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 var(--text);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
h1{font:700 2.1rem/1.1 var(--display);letter-spacing:-.025em;margin:0 0 .35rem;font-stretch:90%}
h2{font:700 1.15rem/1.25 var(--display);letter-spacing:-.01em;margin:0}
h3{font:700 1rem/1.3 var(--display);margin:0 0 .5rem}
.sub{color:var(--ink2);margin:0 0 1.5rem;max-width:62ch}
.mono{font-family:var(--display);font-weight:600;letter-spacing:.02em}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
a{color:var(--euca)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1fr minmax(360px,440px);gap:0}
.login-art{padding:56px 6vw;display:flex;flex-direction:column;justify-content:center;gap:28px}
.login-art h1{font-size:clamp(2.4rem,4.4vw,3.8rem);max-width:12ch;line-height:1}
.login-art p{max-width:46ch;color:var(--ink2);margin:0}
.login-side{background:var(--sheet);border-left:1px solid var(--rule);display:flex;align-items:center;padding:40px 36px}
.login-card{width:100%}
.demo{margin-top:24px;border-top:1px solid var(--rule)}
.demo p{margin:14px 0 6px;font-weight:700;font-size:.9rem}
.demo button{display:flex;width:100%;justify-content:space-between;gap:8px;padding:8px 2px;border:0;border-bottom:1px dashed var(--rule);background:none;cursor:pointer;text-align:left;font-size:.92rem}
.demo button:hover{background:var(--marker-l)}
.brand{display:flex;align-items:center;gap:10px;font:800 1.15rem var(--display);letter-spacing:-.01em}
.brand .cross{width:28px;height:28px;position:relative;flex:none}
.brand .cross:before,.brand .cross:after{content:"";position:absolute;background:var(--marker);border-radius:2px}
.brand .cross:before{left:10px;top:2px;width:8px;height:24px}.brand .cross:after{top:10px;left:2px;height:8px;width:24px}

/* ---------- cartão de consulta (elemento-assinatura) ---------- */
.apcard{background:#FFFDF6;border:1.5px solid var(--ink);border-radius:6px;padding:18px 20px 16px;position:relative;box-shadow:6px 6px 0 var(--ink);max-width:380px}
.apcard:before{content:"";position:absolute;left:0;right:0;top:46px;border-top:1.5px solid var(--ink)}
.apcard .ttl{display:flex;justify-content:space-between;align-items:baseline;font:800 1.05rem var(--display);height:28px}
.apcard .ttl small{font:400 .78rem var(--text);color:var(--ink2)}
.apcard .ln{display:grid;grid-template-columns:96px 1fr;align-items:end;gap:10px;padding-top:14px}
.apcard .ln span{font-size:.8rem;color:var(--ink2)}
.apcard .ln b{border-bottom:1px dotted var(--ink3);min-height:1.55em;font:600 1rem/1.5 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apcard .ln b.vazio{color:var(--ink3);font-weight:400}
.apcard .ln b.falta{border-bottom:2px solid var(--alert);color:var(--alert);font-size:.85rem}
.apcard .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.apcard .pair .ln{grid-template-columns:50px 1fr}
.apcard .foot{margin-top:14px;font-size:.78rem;color:var(--ink2)}
.stamp{position:absolute;right:18px;bottom:14px;transform:rotate(-9deg);border:3px solid var(--euca);color:var(--euca);border-radius:6px;padding:3px 12px;font:800 1.15rem var(--display);letter-spacing:.08em;opacity:.92;background:rgba(255,253,246,.7);animation:carimbo .35s cubic-bezier(.2,1.6,.4,1) both}
.stamp.cancel{border-color:var(--alert);color:var(--alert)}
@keyframes carimbo{from{transform:rotate(-9deg) scale(1.8);opacity:0}}

/* ---------- shell: abas de fichário ---------- */
.top{background:var(--ink);color:#DCE7E2;padding:0 28px}
.top-row{display:flex;align-items:center;gap:18px;height:58px}
.top .brand{color:#fff}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.9rem}
.who b{color:#fff;font-weight:700}
.who .perfil{color:#A9C0B8}
.btn-sair{background:none;border:1px solid #47625B;color:#DCE7E2;border-radius:6px;padding:5px 12px;cursor:pointer}
.btn-sair:hover{border-color:#DCE7E2}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;display:block;padding:10px 16px 11px;color:#C4D4CE;text-decoration:none;font-weight:700;font-size:.92rem;border-radius:8px 8px 0 0;position:relative}
.tabs a:hover{color:#fff;background:#24413C}
.tabs a.on{background:var(--desk);color:var(--ink)}
.tabs a.on:after{content:"";position:absolute;left:16px;right:16px;bottom:5px;height:4px;background:var(--marker);border-radius:2px}
.tabs .grp{width:1px;background:#3A5550;margin:10px 6px}
main{padding:30px 28px 70px;max-width:1260px;margin:0 auto}
.seguro{font-size:.8rem;color:#A9C0B8;display:flex;align-items:center;gap:6px}
.seguro i{width:8px;height:8px;border-radius:50%;background:#6CC59F;display:inline-block}

/* ---------- componentes ---------- */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:22px 24px}
.sheet+.sheet{margin-top:18px}
.grid>.sheet+.sheet{margin-top:0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:20px 22px}
.card+.card{margin-top:18px}.grid>.card+.card{margin-top:0}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:6px;border:1.5px solid var(--ink);background:var(--sheet);cursor:pointer;font-weight:700;font-size:.92rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--desk)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#0F211E}
.btn.mark{background:var(--marker);border-color:var(--ink);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.mark:hover{background:#FFD866}
.btn.mark:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.dan{color:var(--alert);border-color:#E3B3AD}
.btn.dan:hover{background:var(--alert-l)}
.btn.dan.solid{background:var(--alert);color:#fff;border-color:var(--alert)}
.btn.sm{padding:5px 11px;font-size:.84rem;border-width:1px}
.btn.lg{padding:13px 18px;font-size:1.02rem;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--euca);padding:0;text-decoration:underline}
label.f{display:block;font-weight:700;font-size:.9rem;margin-bottom:14px}
label.f span.req{color:var(--alert)}
.in,select.in,textarea.in{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1.5px solid #B9C6C0;border-radius:6px;background:#fff;font-weight:400;font-size:1rem}
.in:focus{outline:3px solid var(--marker-l);border-color:var(--ink)}
.invalid .in,.in.invalid{border-color:var(--alert);background:#FFF9F8}
.ferr{display:block;color:var(--alert);font-weight:700;font-size:.82rem;margin-top:5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;white-space:nowrap}
.pill:before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.pill.info{color:var(--cobalt)}.pill.ok{color:var(--euca)}.pill.err{color:var(--alert)}
.pill.warn{color:var(--marker-d)}.pill.muted{color:var(--ink3)}.pill.pri{color:var(--ink)}
.pill.flat:before{display:none}
.msg{border-left:5px solid;padding:11px 14px;font-size:.93rem;margin:12px 0;background:var(--sheet)}
.msg b{display:block;margin-bottom:2px;font-family:var(--display)}
.msg.err{border-color:var(--alert);background:var(--alert-l);color:#6E1A14}
.msg.ok{border-color:var(--euca);background:var(--euca-l);color:#173E35}
.msg.warn{border-color:var(--marker);background:var(--marker-l);color:#5A4100}
.msg.info{border-color:var(--cobalt);background:var(--cobalt-l);color:#1C335C}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th{text-align:left;font-weight:700;font-size:.85rem;color:var(--ink2);padding:10px 12px;border-bottom:2px solid var(--ink);background:var(--sheet)}
td{padding:11px 12px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tbody tr:hover td{background:#FAFCFA}
tr:last-child td{border-bottom:0}
.tw{overflow:auto;border:1px solid var(--rule);border-radius:4px;background:var(--sheet)}
.kpi{padding:16px 0 4px;border-top:3px solid var(--ink)}
.kpi .v{font:800 2.5rem/1 var(--display);letter-spacing:-.03em}
.kpi .l{color:var(--ink2);font-size:.9rem;margin-top:6px}
.empty{padding:28px;text-align:center;color:var(--ink2)}

/* ---------- agendar: ficha + cartão ---------- */
.ag{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:34px;align-items:start}
.ficha{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
.step{display:grid;grid-template-columns:62px 1fr;border-bottom:1px solid var(--rule)}
.step:last-child{border-bottom:0}
.step>.gut{border-right:1px solid var(--rule);display:flex;justify-content:center;padding-top:22px}
.step>.bd{padding:20px 24px 22px;min-width:0}
.step>.bd>header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.num{font:800 1.5rem/1 var(--display);color:var(--ink3)}
.step.done .num{color:var(--euca)}
.step.invalid{background:#FFF8F7}
.step.invalid .num{color:var(--alert)}
.step.invalid>.gut{border-right:3px solid var(--alert)}
.res-list{display:flex;flex-direction:column;margin-top:10px;max-height:270px;overflow:auto;border-top:1px solid var(--rule2)}
.res-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--rule2);background:none;padding:10px 4px;cursor:pointer;text-align:left}
.res-list button:hover{background:var(--marker-l)}
.sel{display:flex;align-items:center;gap:14px}
.sel .nome{font:700 1.2rem var(--display)}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 .85rem var(--display);flex:none}
.chips{display:flex;gap:0;overflow-x:auto;margin:12px 0 4px;border:1px solid var(--rule);border-radius:4px;scrollbar-width:thin}
.chip{flex:1 0 58px;border:0;border-right:1px solid var(--rule2);background:#fff;padding:8px 2px 9px;text-align:center;cursor:pointer;line-height:1.15;position:relative}
.chip:last-child{border-right:0}
.chip .w{font-size:.74rem;color:var(--ink2)}
.chip .d{font:700 1.2rem var(--display)}
.chip .n{font-size:.72rem;margin-top:3px;font-weight:700;color:var(--euca)}
.chip.zero .n{color:var(--ink3)}
.chip.none{background:repeating-linear-gradient(135deg,#fff 0 6px,#F1F4F2 6px 7px)}
.chip.none .d,.chip.none .w{color:var(--ink3)}
.chip:hover{background:var(--marker-l)}
.chip.on{background:var(--marker)}
.chip.on .n,.chip.on .w{color:var(--ink)}
.planner{margin-top:14px;border-top:1px solid var(--rule)}
.planner .hr{display:grid;grid-template-columns:56px 1fr;border-bottom:1px solid var(--rule2);min-height:46px}
.planner .hr>span{font:700 .9rem var(--display);color:var(--ink2);padding-top:12px}
.planner .hr>div{display:flex;flex-wrap:wrap;gap:6px;padding:7px 0}
.slot{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:5px;padding:5px 12px;font:700 .95rem var(--display);cursor:pointer;min-width:70px}
.slot:hover{background:var(--marker-l)}
.slot.on{background:var(--marker);box-shadow:2px 2px 0 var(--ink)}
.slot:disabled{border:1px dashed var(--rule);background:transparent;color:var(--ink3);cursor:not-allowed;text-decoration:line-through;font-weight:400}
.slot.past:disabled{text-decoration:none}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--ink)}
.resumo{position:sticky;top:20px}
.resumo .apcard{max-width:none}
.perf{font-size:.8rem;color:var(--ink2);margin-top:10px}
.sim{display:flex;gap:10px;align-items:flex-start;border:1px dashed #C8B26A;border-radius:6px;padding:10px 12px;font-size:.85rem;margin:20px 0 14px;background:#FFFCF0}
.sim input{margin-top:3px}

/* ---------- semana ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:#fff}
.day{border-right:1px solid var(--rule2);min-height:130px;display:flex;flex-direction:column}
.day:last-child{border-right:0}
.day header{padding:9px 10px;border-bottom:2px solid var(--ink);font:700 .9rem var(--display);display:flex;justify-content:space-between}
.day.today header{background:var(--marker)}
.day .b{padding:6px;display:flex;flex-direction:column;gap:4px}
.ev{border-radius:4px;padding:5px 7px;font-size:.8rem;border-left:4px solid var(--cobalt);background:var(--cobalt-l);cursor:pointer;line-height:1.3}
.ev.confirmada{background:var(--euca-l);border-color:var(--euca)}
.ev.realizada{background:#F2F4F3;border-color:var(--ink3);color:var(--ink2)}
.ev.livre{background:none;border-left:4px solid transparent;color:var(--ink3);cursor:default;border-bottom:1px dashed var(--rule2);border-radius:0}
.ev b{font-family:var(--display);margin-right:5px}

/* ---------- modal e avisos ---------- */
.ovl{position:fixed;inset:0;background:rgba(24,48,44,.5);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:6px;width:100%;max-width:540px;border:1.5px solid var(--ink);box-shadow:8px 8px 0 rgba(24,48,44,.35)}
.modal.wide{max-width:780px}
.modal>header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--rule)}
.modal .x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--ink2)}
.mbody{padding:20px 22px}
.modal>footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--rule);flex-wrap:wrap}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:390px}
.toast{background:var(--ink);color:#fff;border-radius:6px;padding:12px 16px;font-size:.92rem;border-left:6px solid var(--marker);animation:tin .2s ease}
.toast.err{border-left-color:#F2877E}.toast.warn{border-left-color:#F6C945}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 14px;font-size:.95rem}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:700}
.tl{border-left:2px solid var(--rule);margin:6px 0 0 6px;padding-left:16px;font-size:.88rem}
.tl div{margin-bottom:8px;position:relative}
.tl div:before{content:"";position:absolute;left:-22px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink)}
.bar{height:10px;background:var(--rule2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.note{font-size:.84rem;color:var(--ink2);border-top:1px solid var(--rule2);margin-top:16px;padding-top:12px}
.cbx{width:18px;height:18px;accent-color:var(--ink);cursor:pointer}
.tag-req{font:700 .8rem var(--display);background:var(--marker-l);border:1px solid #E8D27E;padding:1px 7px;border-radius:4px;white-space:nowrap}
textarea.in{min-height:140px;font:.8rem/1.4 ui-monospace,Menlo,Consolas,monospace}
@media (max-width:1020px){
  .ag{grid-template-columns:1fr}.resumo{position:static}
  .g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}
}
@media (max-width:760px){
  .login{grid-template-columns:1fr}.login-art{padding:32px 22px}.login-side{border-left:0;border-top:1px solid var(--rule);padding:28px 22px}
  main{padding:20px 14px 50px}.top{padding:0 12px}
  .g2,.grid[style]{grid-template-columns:1fr !important}
  .seguro,.who .perfil{display:none}
  .kv{grid-template-columns:105px 1fr}
  .step{grid-template-columns:40px 1fr}.step>.bd{padding:16px 14px}
  h1{font-size:1.7rem}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   SGC — Sistema de Gestão de Clínica Médica · Protótipo navegável
   Camadas: Modelo (S) · Serviços/Controle (svc) · Interface (views)
   ===================================================================== */
const CLINICA = { nome: 'Clínica SGC', endereco: 'Rua das Acácias, 250 — Centro', telefone: '(11) 3000-0000' };
const STORE_KEY = 'sgc-prototipo-v1';
const SESSAO_MIN = 15, MAX_TENT = 5, BLOQ_MIN = 2;

const PERFIS = { admin: 'Administrador', recepcionista: 'Recepcionista', medico: 'Médico', paciente: 'Paciente' };
const PERMS = [
  ['dashboard', 'Ver painel da clínica'],
  ['pacientes.ver', 'Consultar pacientes'],
  ['pacientes.editar', 'Cadastrar/atualizar pacientes'],
  ['medicos.ver', 'Consultar médicos e especialidades'],
  ['medicos.gerir', 'Cadastrar médicos e especialidades'],
  ['agendas.ver', 'Consultar agendas dos médicos'],
  ['agendas.gerir', 'Definir disponibilidade (agenda)'],
  ['consultas.ver', 'Consultar consultas'],
  ['consultas.agendar', 'Incluir (agendar) consultas'],
  ['consultas.remarcar', 'Remarcar consultas'],
  ['consultas.cancelar', 'Cancelar consultas'],
  ['agenda.propria', 'Ver a própria agenda (médico)'],
  ['consultas.proprias', 'Ver as próprias consultas (paciente)'],
  ['usuarios.gerir', 'Gerir usuários e autorizações'],
  ['backup', 'Backup e restauração'],
  ['auditoria', 'Ver trilha de auditoria'],
];
const PERM_PADRAO = {
  admin: ['dashboard','pacientes.ver','pacientes.editar','medicos.ver','medicos.gerir','agendas.ver','agendas.gerir','consultas.ver','consultas.agendar','consultas.remarcar','consultas.cancelar','usuarios.gerir','backup','auditoria'],
  recepcionista: ['dashboard','pacientes.ver','pacientes.editar','medicos.ver','agendas.ver','consultas.ver','consultas.agendar','consultas.remarcar','consultas.cancelar'],
  medico: ['agenda.propria'],
  paciente: ['consultas.proprias'],
};
const PERM_TRAVADAS = { admin: ['usuarios.gerir'] };
const STATUS = {
  agendada: { l: 'Agendada', c: 'info' }, confirmada: { l: 'Confirmada', c: 'ok' },
  cancelada: { l: 'Cancelada', c: 'err' }, realizada: { l: 'Realizada', c: 'muted' },
};
const ativa = c => c.status === 'agendada' || c.status === 'confirmada';

/* ---------------- utilidades ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDias = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const hoje = () => iso(new Date());
const DS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const fData = s => s ? s.split('-').reverse().join('/') : '';
const fDataL = s => { const d = parse(s); return `${DS[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const toMin = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const agoraMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fTs = ts => new Date(ts).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const iniciais = n => n.replace(/^(Dra?\.)\s*/, '').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const futura = c => c.data > hoje() || (c.data === hoje() && toMin(c.horario) > agoraMin());
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* CPF */
const dvCPF = nums => { let s = 0; const n = nums.length + 1; nums.forEach((d, i) => s += d * (n - i)); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
const fmtCPF = d => d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
function gerarCPF(rnd) { const n = Array.from({ length: 9 }, () => Math.floor(rnd() * 10)); n.push(dvCPF(n)); n.push(dvCPF(n)); return fmtCPF(n.join('')); }
function validarCPF(c) { const d = String(c).replace(/\D/g, ''); if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false; const n = d.split('').map(Number); return dvCPF(n.slice(0, 9)) === n[9] && dvCPF(n.slice(0, 10)) === n[10]; }
const ocultarCPF = c => '***.' + c.slice(4, 11) + '-**';
function mascara(tipo, v) {
  let d = v.replace(/\D/g, '');
  if (tipo === 'cpf') { d = d.slice(0, 11); return d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1-$2'); }
  if (tipo === 'tel') { d = d.slice(0, 11); if (d.length <= 2) return d ? '(' + d : ''; if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`; if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; }
  return v;
}

/* Hash de senhas (RNF02) — SHA-256 com salt */
async function hashSenha(senha, salt) {
  const data = new TextEncoder().encode(salt + ':' + senha);
  try { const buf = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 2166136261; for (const b of data) { h ^= b; h = Math.imul(h, 16777619); } return 'fnv' + (h >>> 0).toString(16); }
}
const novoSalt = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);

async function criarUsuarioBruto({ login, nome, perfil, senha, medicoId = null, pacienteId = null }) {

function gerarCodigo() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c; do { c = 'SGC-' + Array.from({ length: 5 }, () => A[Math.floor(Math.random() * A.length)]).join(''); } while (S.consultas.some(x => x.codigo === c)); return c; }
function criarConsultaBruta(pacienteId, medicoId, data, horario, status, autor) {

/* =====================================================================
   SERVIÇOS (Controle) — onde as regras de negócio são garantidas
   ===================================================================== */
function slotsDaAgenda(ag, dur) { const out = []; for (let t = toMin(ag.horaInicio); t + dur <= toMin(ag.horaFim); t += dur) out.push(hhmm(t)); return out; }

/** RF03 · Agenda.consultarDisponibilidade() */
function horariosDisponiveis(medicoId, data, ignorarConsultaId = null) {
  const t0 = performance.now();
  const m = med(medicoId);
  const ags = S.agendas.filter(a => a.medicoId === +medicoId && a.data === data);
  const ocup = new Map(S.consultas.filter(c => c.medicoId === +medicoId && c.data === data && ativa(c) && c.id !== ignorarConsultaId).map(c => [c.horario, c]));
  const h = hoje(), nm = agoraMin();
  const slots = [...new Set(ags.flatMap(a => slotsDaAgenda(a, m ? m.duracao : 30)))].sort().map(hora => ({
    hora, consulta: ocup.get(hora) || null, passado: data < h || (data === h && toMin(hora) <= nm),
  }));
  const livres = slots.filter(s => !s.consulta && !s.passado);
  return { slots, livres, temAgenda: ags.length > 0, ms: performance.now() - t0 };
}

/** Valida RN01, RN02 e conflitos do paciente para um horário */
function validarHorario(medicoId, data, horario, pacienteId, ignorarConsultaId = null) {
  const m = med(medicoId);
  if (!m || !m.ativo) throw new ErroNegocio('MED', 'O médico selecionado não está ativo no cadastro.', ['medico']);
  if (data < hoje() || (data === hoje() && toMin(horario) <= agoraMin())) throw new ErroNegocio('PAS', 'Não é possível marcar consultas em data ou horário que já passou.', ['horario']);
  const r = horariosDisponiveis(medicoId, data, ignorarConsultaId);
  if (!r.slots.some(s => s.hora === horario))
    throw new ErroNegocio('RN02', `O horário ${horario} está fora da disponibilidade cadastrada de ${m.nome} em ${fData(data)}. (RN02)`, ['horario']);
  const conf = S.consultas.find(c => c.medicoId === +medicoId && c.data === data && c.horario === horario && ativa(c) && c.id !== ignorarConsultaId);
  if (conf) throw new ErroNegocio('RN01', `Conflito de agendamento: ${m.nome} já possui consulta ativa em ${fData(data)} às ${horario}. O horário pode ter sido reservado por outro usuário — selecione um novo horário. (RN01 · FA03)`, ['horario']);
  const confP = S.consultas.find(c => c.pacienteId === +pacienteId && c.data === data && c.horario === horario && ativa(c) && c.id !== ignorarConsultaId);
  if (confP) throw new ErroNegocio('PAC', `O paciente já possui outra consulta ativa em ${fData(data)} às ${horario} (${med(confP.medicoId).nome}).`, ['horario']);
}

/** RF04 · UC01 – Agendar consulta (passos 7, 8 e 9) */
function agendarConsulta(d, opcoes = {}) {
  exigir('consultas.agendar', 'incluir consultas');
  const faltam = [];
  if (!d.pacienteId) faltam.push('paciente');
  if (!d.medicoId) faltam.push('medico');
  if (!d.data) faltam.push('data');
  if (!d.horario) faltam.push('horario');
  if (faltam.length) throw new ErroNegocio('FA04', 'Preencha as informações obrigatórias destacadas antes de confirmar: ' + faltam.map(f => ({ paciente: 'paciente', medico: 'médico', data: 'data', horario: 'horário' }[f])).join(', ') + '.', faltam);
  const p = pac(d.pacienteId);
  if (!p) throw new ErroNegocio('RN03', 'O paciente precisa estar cadastrado para que a consulta seja confirmada. (RN03)', ['paciente']);
  if (opcoes.simularConcorrencia) {
    // FA03 · outro recepcionista reserva o mesmo horário um instante antes da confirmação
    const outro = S.pacientes.find(x => x.id !== p.id && !S.consultas.some(c => c.pacienteId === x.id && c.data === d.data && c.horario === d.horario && ativa(c)));
    const livre = !S.consultas.some(c => c.medicoId === +d.medicoId && c.data === d.data && c.horario === d.horario && ativa(c));
    if (outro && livre) { criarConsultaBruta(outro.id, +d.medicoId, d.data, d.horario, 'agendada', 'recepcao2 (simulação)'); auditar('Consulta agendada', `[simulação FA03] por outro usuário · ${fData(d.data)} ${d.horario}`); }
  }
  validarHorario(d.medicoId, d.data, d.horario, d.pacienteId);
  const u = usuarioAtual();
  const c = criarConsultaBruta(p.id, +d.medicoId, d.data, d.horario, 'agendada', u.login);
  auditar('Consulta agendada', `${c.codigo} · ${p.nome} · ${med(c.medicoId).nome} · ${fData(c.data)} ${c.horario}`);
  notificar(c, 'agendamento');
  salvar();
  return c;
}

/** RF05 · Remarcar */
function remarcarConsulta(id, data, horario) {
  exigir('consultas.remarcar', 'remarcar consultas');
  const c = cons(id);
  if (!c || !ativa(c)) throw new ErroNegocio('ST', 'Somente consultas ativas podem ser remarcadas.');
  if (!data || !horario) throw new ErroNegocio('FA04', 'Selecione a nova data e o novo horário.', [!data ? 'data' : 'horario']);
  if (data === c.data && horario === c.horario) throw new ErroNegocio('IG', 'Escolha uma data ou horário diferente do atual.', ['horario']);
  validarHorario(c.medicoId, data, horario, c.pacienteId, c.id);
  const antes = `${fData(c.data)} ${c.horario}`;
  c.data = data; c.horario = horario; c.status = 'agendada';
  c.historico.push({ ts: Date.now(), por: usuarioAtual().login, txt: `Remarcada de ${antes} para ${fData(data)} às ${horario}` });
  auditar('Consulta remarcada', `${c.codigo} · ${antes} → ${fData(data)} ${horario}`);
  notificar(c, 'remarcacao', antes);
  salvar(); return c;
}

/** RF05 · Cancelar */
function cancelarConsulta(id, motivo) {
  exigir('consultas.cancelar', 'cancelar consultas');
  const c = cons(id);
  if (!c || !ativa(c)) throw new ErroNegocio('ST', 'Somente consultas ativas podem ser canceladas.');
  if (!motivo || motivo.trim().length < 3) throw new ErroNegocio('FA04', 'Informe o motivo do cancelamento.', ['motivo']);
  c.status = 'cancelada'; c.motivoCancelamento = motivo.trim();
  c.historico.push({ ts: Date.now(), por: usuarioAtual().login, txt: `Cancelada — motivo: ${motivo.trim()}` });
  auditar('Consulta cancelada', `${c.codigo} · ${motivo.trim()}`);
  notificar(c, 'cancelamento');
  salvar(); return c;
}

/** RF07 · Paciente confirma presença (apenas suas consultas) */
function confirmarPresenca(id) {
  exigir('consultas.proprias', 'confirmar consultas');
  const u = usuarioAtual(), c = cons(id);
  if (!c || c.pacienteId !== u.pacienteId) throw new ErroNegocio('RN04', 'Esta consulta não pertence ao seu cadastro.');
  if (c.status !== 'agendada') throw new ErroNegocio('ST', 'Esta consulta não está aguardando confirmação.');
  c.status = 'confirmada';
  c.historico.push({ ts: Date.now(), por: u.login, txt: 'Presença confirmada pelo paciente' });
  auditar('Presença confirmada', c.codigo); salvar(); return c;
}
function marcarRealizada(id) {
  exigir('agenda.propria', 'registrar atendimento');
  const u = usuarioAtual(), c = cons(id);
  if (!c || c.medicoId !== u.medicoId) throw new ErroNegocio('RN04', 'Esta consulta não pertence à sua agenda.');
  if (!ativa(c)) throw new ErroNegocio('ST', 'A consulta não está ativa.');
  if (c.data > hoje()) throw new ErroNegocio('ST', 'Somente consultas de hoje ou anteriores podem ser registradas como realizadas.');
  c.status = 'realizada'; c.historico.push({ ts: Date.now(), por: u.login, txt: 'Atendimento registrado pelo médico' });
  auditar('Atendimento registrado', c.codigo); salvar(); return c;
}

/** Notificação ao paciente (RF07 · UC01 passo 9) — envio simulado */
function notificar(c, tipo, extra) {
  const p = pac(c.pacienteId), m = med(c.medicoId), e = esp(m.especialidadeId);
  const base = `${m.nome} (${e.nome}) · ${fDataL(c.data)} às ${c.horario} · ${CLINICA.nome}, ${CLINICA.endereco}. Código ${c.codigo}.`;
  const txt = {
    agendamento: `Olá, ${p.nome.split(' ')[0]}! Sua consulta foi agendada: ${base} Chegue com 15 min de antecedência e traga documento com foto.`,
    remarcacao: `Olá, ${p.nome.split(' ')[0]}! Sua consulta de ${extra} foi remarcada para: ${base}`,
    cancelamento: `Olá, ${p.nome.split(' ')[0]}. Sua consulta ${c.codigo} com ${m.nome} em ${fData(c.data)} às ${c.horario} foi cancelada. Para remarcar, ligue ${CLINICA.telefone}.`,
  }[tipo];
  S.notificacoes.unshift({ id: nextId('not'), ts: Date.now(), pacienteId: p.id, consultaId: c.id, tipo, canais: [p.email ? 'e-mail' : null, p.telefone ? 'SMS' : null].filter(Boolean), destino: [p.email, p.telefone].filter(Boolean).join(' · '), texto: txt });
}

/** RF01 · Pacientes */
function salvarPaciente(dados) {
  exigir('pacientes.editar', 'cadastrar ou atualizar pacientes');
  const er = {};
  const nome = (dados.nome || '').trim().replace(/\s+/g, ' ');
  if (nome.split(' ').length < 2) er.nome = 'Informe o nome completo (nome e sobrenome).';
  if (!validarCPF(dados.cpf)) er.cpf = 'CPF inválido. Confira os 11 dígitos.';
  else if (S.pacientes.some(p => p.cpf === dados.cpf && p.id !== +dados.id)) er.cpf = 'Já existe um paciente cadastrado com este CPF.';
  if (!dados.nascimento) er.nascimento = 'Informe a data de nascimento.';
  else if (dados.nascimento > hoje()) er.nascimento = 'A data de nascimento não pode ser futura.';
  if ((dados.telefone || '').replace(/\D/g, '').length < 10) er.telefone = 'Informe um telefone com DDD.';
  if (dados.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dados.email)) er.email = 'E-mail em formato inválido.';
  if (Object.keys(er).length) { const e = new ErroNegocio('VAL', 'Corrija os campos destacados.'); e.porCampo = er; throw e; }
  let p;
  if (dados.id) { p = pac(dados.id); Object.assign(p, { nome, cpf: dados.cpf, nascimento: dados.nascimento, telefone: dados.telefone, email: dados.email.trim() }); auditar('Paciente atualizado', p.nome); }

  salvar(); return p;
}

/** RF02 · Médicos e especialidades */
function salvarEspecialidade(nome) {
  exigir('medicos.gerir', 'cadastrar especialidades');
  nome = (nome || '').trim();
  if (nome.length < 3) throw new ErroNegocio('VAL', 'Informe o nome da especialidade.', ['nome']);
  if (S.especialidades.some(e => norm(e.nome) === norm(nome))) throw new ErroNegocio('VAL', 'Esta especialidade já está cadastrada.', ['nome']);
  const e = { id: nextId('esp'), nome }; S.especialidades.push(e); auditar('Especialidade cadastrada', nome); salvar(); return e;
}
async function salvarMedico(d) {
  exigir('medicos.gerir', 'cadastrar médicos');
  const er = {};
  if ((d.nome || '').trim().split(/\s+/).length < 2) er.nome = 'Informe o nome completo.';
  if (!/^CRM\/[A-Z]{2}\s?\d{4,6}$/i.test((d.crm || '').trim())) er.crm = 'Use o formato CRM/UF 123456.';
  else if (S.medicos.some(m => norm(m.crm).replace(/\s/g, '') === norm(d.crm).replace(/\s/g, '') && m.id !== +d.id)) er.crm = 'CRM já cadastrado.';
  if (!esp(d.especialidadeId)) er.especialidadeId = 'Selecione a especialidade.';
  if (!d.id && d.criarUsuario) {
    if (!/^[a-z0-9._-]{3,}$/.test(d.login || '')) er.login = 'Login com 3+ caracteres (letras minúsculas, números, ponto).';
    else if (S.usuarios.some(u => u.login === d.login)) er.login = 'Login já em uso.';
    if ((d.senha || '').length < 8) er.senha = 'A senha deve ter ao menos 8 caracteres.';
  }
  if (Object.keys(er).length) { const e = new ErroNegocio('VAL', 'Corrija os campos destacados.'); e.porCampo = er; throw e; }
  let m;
  if (d.id) {
    m = med(d.id);
    Object.assign(m, { nome: d.nome.trim(), crm: d.crm.trim().toUpperCase(), especialidadeId: +d.especialidadeId, duracao: +d.duracao });
    auditar('Médico atualizado', m.nome);
  } else {
    m = { id: nextId('med'), nome: d.nome.trim(), crm: d.crm.trim().toUpperCase(), especialidadeId: +d.especialidadeId, duracao: +d.duracao, ativo: true };
    S.medicos.push(m); auditar('Médico cadastrado', `${m.nome} · ${esp(m.especialidadeId).nome}`);
    if (d.criarUsuario) { await criarUsuarioBruto({ login: d.login, nome: m.nome, perfil: 'medico', senha: d.senha, medicoId: m.id }); auditar('Usuário criado', `${d.login} (médico)`); }
  }
  salvar(); return m;
}
function alternarMedico(id) {
  exigir('medicos.gerir', 'alterar médicos');
  const m = med(id);
  if (m.ativo && S.consultas.some(c => c.medicoId === m.id && ativa(c) && futura(c)))
    throw new ErroNegocio('VAL', `${m.nome} possui consultas futuras ativas. Remarque ou cancele-as antes de inativar o cadastro.`);
  m.ativo = !m.ativo; auditar(m.ativo ? 'Médico reativado' : 'Médico inativado', m.nome); salvar();
}

/** Agenda do médico (classe Agenda) */
function adicionarDisponibilidade(d) {
  exigir('agendas.gerir', 'definir disponibilidade');
  const er = {};
  if (!med(d.medicoId)) er.medicoId = 'Selecione o médico.';
  if (!d.de) er.de = 'Informe a data inicial.'; else if (d.de < hoje()) er.de = 'A data inicial não pode estar no passado.';
  if (!d.ate) er.ate = 'Informe a data final.'; else if (d.de && d.ate < d.de) er.ate = 'A data final deve ser igual ou posterior à inicial.';
  else if (d.de && (parse(d.ate) - parse(d.de)) / 864e5 > 120) er.ate = 'Período máximo de 120 dias por vez.';
  if (!d.dias.length) er.dias = 'Marque ao menos um dia da semana.';
  if (!d.ini || !d.fim) er.fim = 'Informe início e fim do expediente.';
  else if (toMin(d.fim) - toMin(d.ini) < (med(d.medicoId)?.duracao || 30)) er.fim = 'O expediente deve comportar ao menos uma consulta.';
  if (Object.keys(er).length) { const e = new ErroNegocio('VAL', 'Corrija os campos destacados.'); e.porCampo = er; throw e; }
  let criadas = 0, sobrepostas = [];
  for (let dt = d.de; dt <= d.ate; dt = addDias(dt, 1)) {
    if (!d.dias.includes(parse(dt).getDay())) continue;
    const sob = S.agendas.some(a => a.medicoId === +d.medicoId && a.data === dt && toMin(d.ini) < toMin(a.horaFim) && toMin(a.horaInicio) < toMin(d.fim));
    if (sob) { sobrepostas.push(fData(dt)); continue; }
    S.agendas.push({ id: nextId('ag'), medicoId: +d.medicoId, data: dt, horaInicio: d.ini, horaFim: d.fim }); criadas++;
  }
  auditar('Disponibilidade cadastrada', `${med(d.medicoId).nome} · ${criadas} dia(s) · ${d.ini}–${d.fim}`);
  salvar(); return { criadas, sobrepostas };
}
function removerDisponibilidade(id) {
  exigir('agendas.gerir', 'alterar disponibilidade');
  const a = S.agendas.find(x => x.id === +id);
  const m = med(a.medicoId);
  const afetadas = S.consultas.filter(c => c.medicoId === a.medicoId && c.data === a.data && ativa(c) && toMin(c.horario) >= toMin(a.horaInicio) && toMin(c.horario) < toMin(a.horaFim));
  if (afetadas.length) throw new ErroNegocio('RN02', `Há ${afetadas.length} consulta(s) ativa(s) neste período. Remarque ou cancele-as antes de remover a disponibilidade (RN02).`);
  S.agendas = S.agendas.filter(x => x.id !== a.id);
  auditar('Disponibilidade removida', `${m.nome} · ${fData(a.data)} ${a.horaInicio}–${a.horaFim}`); salvar();
}

/** RF08 · Autenticação */
async function login(loginTxt, senha) {
  loginTxt = (loginTxt || '').trim().toLowerCase();
  if (!loginTxt || !senha) throw new ErroNegocio('FA04', 'Informe usuário e senha.');
  const t = S.tentativas[loginTxt] || { n: 0, ate: 0 };
  if (t.ate > Date.now()) { const s = Math.ceil((t.ate - Date.now()) / 1000); throw new ErroNegocio('BLQ', `Acesso temporariamente bloqueado por excesso de tentativas. Tente novamente em ${Math.floor(s / 60)}min ${s % 60}s.`); }
  const u = S.usuarios.find(x => x.login === loginTxt);
  const ok = u && u.ativo && (await hashSenha(senha, u.salt)) === u.senhaHash;
  if (!ok) {
    t.n++; if (t.n >= MAX_TENT) { t.ate = Date.now() + BLOQ_MIN * 60000; t.n = 0; }
    S.tentativas[loginTxt] = t;
    S.auditoria.unshift({ ts: Date.now(), usuario: loginTxt, perfil: '-', acao: 'Falha de autenticação', detalhe: u && !u.ativo ? 'usuário inativo' : 'usuário ou senha inválidos' });
    salvar();
    const rest = t.ate > Date.now() ? 0 : MAX_TENT - t.n;
    throw new ErroNegocio('AUT', u && !u.ativo ? 'Este usuário está inativo. Procure o administrador.' : `Usuário ou senha inválidos.${rest ? ` Restam ${rest} tentativa(s) antes do bloqueio temporário.` : ` Acesso bloqueado por ${BLOQ_MIN} minutos.`}`);
  }
  delete S.tentativas[loginTxt];
  u.ultimoAcesso = Date.now();
  SESSAO = { userId: u.id, ultimo: Date.now() }; salvarSessao();
  auditar('Login', `Perfil ${PERFIS[u.perfil]}`);
  if (pode('backup')) backupAutomaticoSeNecessario();
  salvar(); return u;
}
function logout(motivo) {
  if (SESSAO) auditar('Logout', motivo || 'Encerrado pelo usuário');
  SESSAO = null; salvarSessao(); salvar();
  AG = agNovo();
  location.hash = '';
  render();
  if (motivo) toast(motivo, 'warn');
}

/** RNF04 · Backup e restauração */
function dadosDominio() { const { backups, auditoria, tentativas, ...resto } = S; return clone(resto); }
function criarBackup(tipo = 'Manual') {
  if (tipo === 'Manual') exigir('backup', 'gerar backup');
  const u = usuarioAtual();
  const b = { id: nextId('bkp'), ts: Date.now(), autor: u ? u.login : 'sistema', tipo, dados: JSON.stringify(dadosDominio()) };
  S.backups.unshift(b); if (S.backups.length > 12) S.backups.length = 12;
  auditar('Backup gerado', `${tipo} · ${(b.dados.length / 1024).toFixed(1)} KB`); salvar(); return b;
}
function backupAutomaticoSeNecessario() { const ult = S.backups[0]; if (!ult || Date.now() - ult.ts > 864e5) criarBackup('Automático (diário)'); }
function validarEstrutura(o) { return o && ['especialidades', 'medicos', 'pacientes', 'agendas', 'consultas', 'usuarios', 'permissoes', 'seq'].every(k => k in o); }
function restaurarDados(json, origem) {
  exigir('backup', 'restaurar dados');
  let o; try { o = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { throw new ErroNegocio('BKP', 'O conteúdo informado não é um JSON válido.'); }
  if (!validarEstrutura(o)) throw new ErroNegocio('BKP', 'O arquivo não corresponde a um backup do SGC (estrutura incompleta).');
  criarBackup('Pré-restauração (automático)');
  const keep = { backups: S.backups, auditoria: S.auditoria, tentativas: S.tentativas };
  S = Object.assign(clone(o), keep);
  S.notificacoes = S.notificacoes || [];
  if (!S.usuarios.some(u => u.id === SESSAO.userId)) { logout('Sessão encerrada: seu usuário não existe no backup restaurado.'); return; }
  auditar('Dados restaurados', origem); salvar();
}

  const nq = norm(q), dq = q.replace(/\D/g, '');
  const res = S.pacientes.filter(p => norm(p.nome).includes(nq) || (dq.length >= 3 && p.cpf.replace(/\D/g, '').includes(dq))).slice(0, 8);
  if (!res.length) return `<div class="msg warn"><b>Paciente não encontrado (FA01)</b>Nenhum cadastro corresponde a “${esc(q)}”. A consulta só pode ser confirmada para pacientes cadastrados (RN03).

function chipsDias(medicoId, sel, act, n = 14) {

    const d = addDias(h, i); const r = horariosDisponiveis(medicoId, d); const dt = parse(d);

    out += `<button class="chip ${cls} ${d === sel ? 'on' : ''}" data-act="${act}" data-d="${d}" aria-pressed="${d === sel}" title="${r.temAgenda ? r.livres.length + ' horário(s) livre(s)' : 'Sem atendimento'}"><div class="w">${DS[dt.getDay()]}</div><div class="d">${dt.getDate()}</div><div class="n">${r.temAgenda ? r.livres.length + ' livre' + (r.livres.length === 1 ? '' : 's') : 'folga'}</div></button>`;
  }

}
function slotsHTML(r, sel, act) {
  if (!r.temAgenda) return '';
  const porHora = new Map();
  r.slots.forEach(s => { const k = s.hora.slice(0, 2); if (!porHora.has(k)) porHora.set(k, []); porHora.get(k).push(s); });
  return `<div class="planner" role="group" aria-label="Horários">${[...porHora.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([h, ss]) => `<div class="hr"><span>${h}h</span><div>${ss.map(s => {
    const dis = s.consulta || s.passado;
    return `<button class="slot ${s.hora === sel ? 'on' : ''} ${s.passado && !s.consulta ? 'past' : ''}" data-act="${act}" data-h="${s.hora}" ${dis ? 'disabled' : ''} aria-pressed="${s.hora === sel}" title="${s.consulta ? 'Ocupado' : s.passado ? 'Horário já passou' : 'Livre'}">${s.hora}</button>`;
  }).join('')}</div></div>`).join('')}</div>
  <div class="legend"><span><i></i>Livre</span><span><i style="background:var(--marker)"></i>Escolhido</span><span><i style="border:1px dashed var(--rule)"></i>Ocupado ou passado</span></div>`;
}
function sugestoesFA02(medicoId, data, r) {

  const outros = S.medicos.filter(x => x.ativo && x.id !== m.id && x.especialidadeId === m.especialidadeId).map(x => ({ x, n: horariosDisponiveis(x.id, data).livres.length })).filter(o => o.n);

    ${datas.length ? `<div class="row" style="margin-top:10px"><span class="small"><b>Próximas datas livres:</b></span>${datas.map(d => `<button class="btn sm" data-act="ag-dia" data-d="${d}">${fDataL(d)}</button>`).join('')}</div>` : ''}
    ${outros.length ? `<div class="row" style="margin-top:8px"><span class="small"><b>Mesma especialidade neste dia:</b></span>${outros.map(o => `<button class="btn sm" data-act="ag-outro-med" data-id="${o.x.id}">${esc(o.x.nome)} (${o.n} livres)</button>`).join('')}</div>` : ''}</div>`;

function listaDisp(medicoId, g) {
  const l = S.agendas.filter(a => a.medicoId === medicoId && a.data >= hoje() && a.data <= addDias(hoje(), 30)).sort((a, b) => (a.data + a.horaInicio).localeCompare(b.data + b.horaInicio));
  if (!l.length) return '<div class="empty">Nenhuma disponibilidade cadastrada para os próximos 30 dias.</div>';
  return `<div class="tw"><table><thead><tr><th>Data</th><th>Início</th><th>Fim</th><th>Horários</th><th>Ocupados</th>${g ? '<th></th>' : ''}</tr></thead><tbody>${l.map(a => {
    const sl = slotsDaAgenda(a, med(medicoId).duracao); const oc = S.consultas.filter(c => c.medicoId === medicoId && c.data === a.data && ativa(c) && sl.includes(c.horario)).length;
    return `<tr><td>${fDataL(a.data)}</td><td class="mono">${a.horaInicio}</td><td class="mono">${a.horaFim}</td><td>${sl.length}</td><td>${oc}</td>${g ? `<td style="text-align:right"><button class="btn sm dan" data-act="rem-disp" data-id="${a.id}">Remover</button></td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;
}
function semanaHTML(medicoId, ref, act, mostrarPaciente) {
  const d0 = parse(ref); const seg = addDias(ref, -((d0.getDay() + 6) % 7));
  const dias = Array.from({ length: 7 }, (_, i) => addDias(seg, i));
  const u = usuarioAtual();
  const cols = dias.map(d => {
    const r = horariosDisponiveis(medicoId, d);
    const doDia = S.consultas.filter(c => c.medicoId === +medicoId && c.data === d && c.status !== 'cancelada');
    const mapa = new Map(doDia.map(c => [c.horario, c]));
    const horas = [...new Set([...r.slots.map(s => s.hora), ...doDia.map(c => c.horario)])].sort();
    const evs = horas.map(hr => { const c = mapa.get(hr); const s = r.slots.find(x => x.hora === hr);
      return c ? `<div class="ev ${c.status}" data-act="det-cons" data-id="${c.id}"><b>${hr}</b>${mostrarPaciente ? esc(pac(c.pacienteId).nome) : 'Ocupado'}</div>`
               : `<div class="ev livre"><b>${hr}</b>${s && s.passado ? '—' : 'livre'}</div>`; }).join('');
    const dt = parse(d);
    return `<div class="day ${d === hoje() ? 'today' : ''}"><header><span>${DS[dt.getDay()]} ${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}</span><span class="muted small">${r.slots.length ? doDia.length + '/' + r.slots.length : ''}</span></header>
      <div class="b">${horas.length ? evs : '<span class="muted small" style="padding:4px">Sem atendimento</span>'}</div></div>`;
  });
  return `<div class="card"><div class="card-h"><h2>Semana de ${fData(seg)} a ${fData(dias[6])}</h2>
    <div class="row"><button class="btn sm" data-act="${act}" data-n="-7">Semana anterior</button><button class="btn sm" data-act="${act}" data-n="0">Hoje</button><button class="btn sm" data-act="${act}" data-n="7">Próxima semana</button></div></div>
    <div class="week">${cols.join('')}</div>
    <div class="legend"><span><i style="background:var(--info-l);border-left:3px solid var(--info)"></i>Agendada</span><span><i style="background:var(--ok-l);border-left:3px solid var(--ok)"></i>Confirmada</span><span><i style="background:var(--line2)"></i>Realizada</span><span><i style="border:1px dashed #cfd9de"></i>Livre</span></div></div>`;
}
function abrirFormDisp() {
  const m = med(FAg.medicoId);
  abrirModal('Cadastrar disponibilidade', `<form data-sub="disp" id="fDisp" novalidate>
    <label class="f">Médico<select class="in" name="medicoId">${S.medicos.filter(x => x.ativo).map(x => `<option value="${x.id}" ${x.id === m?.id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></label>

    try { exigir('usuarios.gerir', 'criar usuários'); } catch (e) { tratarErro(e); return; }
    if (d.nome.trim().length < 3) er.nome = 'Informe o nome.';
    if (!/^[a-z0-9._-]{3,}$/.test(d.login)) er.login = 'Use 3+ caracteres: letras minúsculas, números, ponto, hífen.'; else if (S.usuarios.some(u => u.login === d.login)) er.login = 'Login já em uso.';
    if ((d.senha || '').length < 8) er.senha = 'A senha deve ter ao menos 8 caracteres.';
    if ((d.perfil === 'medico' || d.perfil === 'paciente') && !d.vinculo) er.vinculo = 'Selecione o vínculo.';
    if (Object.keys(er).length) { mostrarErrosCampos(f, er); return; }
    await criarUsuarioBruto({ login: d.login, nome: d.nome.trim(), perfil: d.perfil, senha: d.senha, medicoId: d.perfil === 'medico' ? +d.vinculo : null, pacienteId: d.perfil === 'paciente' ? +d.vinculo : null });
    auditar('Usuário criado', `${d.login} (${PERFIS[d.perfil]})`); salvar(); fecharModal(); toast(`Usuário ${d.login} criado.`); render();
  },
  senha: async f => {
    try { exigir('usuarios.gerir', 'redefinir senhas'); } catch (e) { tratarErro(e); return; }
    if (f.senha.value.length < 8) { mostrarErrosCampos(f, { senha: 'A senha deve ter ao menos 8 caracteres.' }); return; }
    if (f.senha.value !== f.senha2.value) { mostrarErrosCampos(f, { senha2: 'As senhas não conferem.' }); return; }
    const u = S.usuarios.find(x => x.id === +f.id.value); u.salt = novoSalt(); u.senhaHash = await hashSenha(f.senha.value, u.salt);
    auditar('Senha redefinida', u.login); salvar(); fecharModal(); toast(`Senha de ${u.login} redefinida.`);
  },
};

document.addEventListener('click', e => { const a = e.target.closest('[data-act]');
  if (a && a.dataset.act === 'modal-fundo' && e.target !== a) return; // clique dentro do modal: não interferir (ex.: submit)
  if (a && ACT[a.dataset.act]) { if (a.tagName !== 'A') e.preventDefault(); ACT[a.dataset.act](a, e); } });
document.addEventListener('change', e => { const a = e.target.closest('[data-chg]'); if (a && CHG[a.dataset.chg]) CHG[a.dataset.chg](a, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.mask) { t.value = mascara(t.dataset.mask, t.value); }
  if (t.closest('.invalid')) { const l = t.closest('.invalid'); l.classList.remove('invalid'); l.querySelector('.ferr')?.remove(); }
  const a = t.closest('[data-inp]'); if (a && INP[a.dataset.inp]) INP[a.dataset.inp](a, e);
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; SUB[f.dataset.sub] && SUB[f.dataset.sub](f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').innerHTML) fecharModal(); });
window.addEventListener('hashchange', () => { if (usuarioAtual()) { fecharModal(); render(); } });
// sessão: renova a cada interação e expira por inatividade (RNF02)
['click', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (SESSAO) { SESSAO.ultimo = Date.now(); salvarSessao(); } }, true));
setInterval(() => { if (SESSAO && Date.now() - SESSAO.ultimo > SESSAO_MIN * 60000) { fecharModal(); logout(`Sessão encerrada após ${SESSAO_MIN} minutos de inatividade. Entre novamente.`); } }, 20000);

(async function iniciar() {
  const d = carregar();
  if (d && validarEstrutura(d)) S = d; else await seed();
  const s = carregarSessao();
  if (s && S.usuarios.some(u => u.id === s.userId && u.ativo) && Date.now() - s.ultimo < SESSAO_MIN * 60000) SESSAO = s;
  render();
})();
</script>
</body>
